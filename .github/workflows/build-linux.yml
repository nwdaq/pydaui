name: Build with pyinstaller for Debian based distros

on:
  push:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up PDM with Python 3.13
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: pdm install -G build --frozen-lockfile

    - name: Build
      run: |
        pdm run pyinstaller --noconfirm packaging/pydaui.spec
        ARTIFACT_NAME=pydaui-`git describe --tags --always`-linux
        tar -czf dist/$ARTIFACT_NAME.tar.gz -C dist pydaui
        echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

    - name: Smoke test
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0
        QT_QPA_PLATFORM=offscreen timeout 10 dist/pydaui/pydaui || test $? -eq 124

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        path: dist/${{ env.ARTIFACT_NAME }}.tar.gz
        name: ${{ env.ARTIFACT_NAME }}
